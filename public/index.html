<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f7a6d'/><path d='M9 8h5v16H9zM16 8h3v16h-3zM21 9l3-1 3 15-3 1z' fill='white'/></svg>">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('shelf.theme'); document.documentElement.dataset.theme =
      t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch {}
  </script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/library.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><span data-icon="books" data-size="17"></span></span>
        <span class="brand-name">Shelf</span>
      </div>
      <label class="search">
        <span data-icon="search" data-size="16"></span>
        <input id="search" class="input" type="search" placeholder="Search by title" autocomplete="off" aria-label="Search by title">
      </label>
      <div class="topbar-spacer"></div>
      <label class="sort">
        <span class="sort-label">Sort</span>
        <select id="sort" class="select" aria-label="Sort books">
          <option value="recent">Recently read</option>
          <option value="title">Title</option>
          <option value="progress">Progress</option>
          <option value="added">Date added</option>
        </select>
      </label>
      <button id="addBtn" class="btn btn-primary" type="button" title="Add PDF files (or drag them onto this window)">
        <span data-icon="plus" data-size="16"></span><span class="add-label">Add book</span>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
      <button id="settingsBtn" class="icon-btn" type="button" title="Settings" aria-label="Settings"><span data-icon="settings"></span></button>
    </header>

    <div class="body">
      <aside class="sidebar" aria-label="Folders">
        <nav id="nav"></nav>
        <div class="sidebar-foot">Tip: drag a book onto a folder to move it.</div>
      </aside>

      <main id="main" class="main">
        <div id="scanBanner" class="banner" hidden><span class="spinner"></span> Scanning your books folder for new PDFs…</div>
        <section id="continue" class="continue" hidden>
          <div class="section-head"><h2>Continue reading</h2></div>
          <div id="continueRow" class="continue-row"></div>
        </section>
        <section>
          <div class="section-head">
            <h2 id="viewTitle">All books</h2>
            <span id="viewSub" class="sub"></span>
            <div id="viewBar" class="bar sub-bar" hidden><span></span></div>
          </div>
          <div id="grid" class="grid"></div>
          <div id="empty"></div>
        </section>
      </main>
    </div>
  </div>

  <div id="dropOverlay" class="drop-overlay" aria-hidden="true">
    <div class="drop-pill"><span data-icon="upload"></span><span id="dropLabel">Drop PDFs to add them</span></div>
  </div>

  <div id="uploads" class="uploads" hidden>
    <div class="uploads-head"><span id="uploadsTitle">Adding books</span>
      <button id="uploadsClose" class="icon-btn" type="button" aria-label="Close"><span data-icon="x" data-size="16"></span></button>
    </div>
    <div id="uploadsList" class="uploads-list"></div>
  </div>

  <input id="filePicker" type="file" accept="application/pdf,.pdf" multiple hidden>
  <script type="module" src="/js/library.js"></script>
</body>
</html>
