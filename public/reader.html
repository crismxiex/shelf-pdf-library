<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading · Shelf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f7a6d'/><path d='M9 8h5v16H9zM16 8h3v16h-3zM21 9l3-1 3 15-3 1z' fill='white'/></svg>">
  <script>
    try { const t = localStorage.getItem('shelf.theme'); document.documentElement.dataset.theme =
      t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch {}
  </script>
  <link rel="stylesheet" href="/vendor/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/reader.css">
</head>
<body>
  <header class="rbar">
    <div class="rbar-group rbar-left">
      <a class="icon-btn" href="/" title="Back to library" aria-label="Back to library"><span data-icon="back"></span></a>
      <div class="rtitle"><span id="bookTitle">Loading…</span><span id="saveState" class="save-state"></span></div>
    </div>

    <div class="rbar-group rbar-center">
      <button id="prevBtn" class="icon-btn" type="button" title="Previous page (←)" aria-label="Previous page"><span data-icon="back"></span></button>
      <form id="pageForm" class="page-jump">
        <input id="pageInput" class="input" type="text" inputmode="numeric" aria-label="Page number" value="1">
        <span class="page-total">of <span id="pageCount">–</span></span>
      </form>
      <button id="nextBtn" class="icon-btn" type="button" title="Next page (→)" aria-label="Next page"><span data-icon="next"></span></button>
    </div>

    <div class="rbar-group rbar-right">
      <button id="zoomOut" class="icon-btn" type="button" title="Zoom out (−)" aria-label="Zoom out"><span data-icon="minus"></span></button>
      <select id="zoomSelect" class="select zoom-select" aria-label="Zoom">
        <option value="page-width">Fit width</option>
        <option value="page-fit">Fit page</option>
        <option value="auto">Automatic</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="custom" hidden>Custom</option>
      </select>
      <button id="zoomIn" class="icon-btn" type="button" title="Zoom in (+)" aria-label="Zoom in"><span data-icon="plus"></span></button>
      <button id="fitWidth" class="icon-btn" type="button" title="Fit to width (W)" aria-label="Fit to width"><span data-icon="width"></span></button>
      <span class="rbar-sep"></span>
      <button id="bookmarkBtn" class="icon-btn" type="button" title="Bookmark this page (B)" aria-label="Bookmark this page"><span data-icon="bookmark"></span></button>
      <button id="panelBtn" class="icon-btn" type="button" title="Bookmarks" aria-label="Show bookmarks"><span data-icon="list"></span></button>
      <button id="focusBtn" class="icon-btn" type="button" title="Focus mode: lock Shelf to this book for a set time" aria-label="Start focus mode"><span data-icon="focus"></span></button>
      <button id="darkBtn" class="icon-btn" type="button" title="Dark mode (D)" aria-label="Toggle dark mode"></button>
      <button id="fullBtn" class="icon-btn" type="button" title="Full screen (F)" aria-label="Full screen"></button>
    </div>
  </header>

  <div id="progressLine" class="progress-line"><span></span></div>

  <div id="viewerContainer" class="viewer-container" tabindex="0">
    <div id="viewer" class="pdfViewer"></div>
  </div>

  <aside id="panel" class="panel" hidden aria-label="Bookmarks">
    <div class="panel-head">
      <h2>Bookmarks</h2>
      <button id="panelClose" class="icon-btn" type="button" aria-label="Close bookmarks"><span data-icon="x" data-size="16"></span></button>
    </div>
    <button id="panelAdd" class="btn panel-add" type="button"><span data-icon="plus" data-size="16"></span> Bookmark this page</button>
    <div id="bookmarkList" class="bm-list"></div>
  </aside>

  <div id="focusPill" class="focus-pill" role="timer" aria-live="off" hidden>
    <span data-icon="lock" data-size="16"></span>
    <span id="focusTime">0:00</span>
    <button id="focusEnd" class="btn" type="button">End early…</button>
  </div>
  <div id="fsBanner" class="fs-banner" hidden>
    <span>You left full screen.</span>
    <button id="fsReturn" class="btn btn-primary" type="button">Return to full screen</button>
  </div>

  <div id="loadError" class="load-error" hidden></div>

  <script type="module" src="/js/reader.js"></script>
</body>
</html>
